# =============================================================================
# FREQTRADE AI BOT — docker-compose.yml
# =============================================================================

services:
  freqtrade:
    image: freqtradeorg/freqtrade:stable_freqai
    restart: unless-stopped
    container_name: freqtrade_bot

    volumes:
      - ./user_data:/freqtrade/user_data # OHLCV data, logs, models, DB
      - ./strategies:/freqtrade/user_data/strategies # strateji dosyaları
      - ./config:/freqtrade/config # borsa config dosyaları

    ports:
      - "127.0.0.1:8080:8080" # REST API — sadece localhost

    environment:
      - FREQTRADE__EXCHANGE__KEY=${EXCHANGE_API_KEY}
      - FREQTRADE__EXCHANGE__SECRET=${EXCHANGE_API_SECRET}

    command: >
      trade --logfile /freqtrade/user_data/logs/freqtrade.log --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite --config /freqtrade/config/config_binance.json --strategy TrendMLStrategy --freqaimodel LightGBMRegressor --userdir /freqtrade/user_data

    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/v1/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
